[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tingque-rankpt"
version = "0.1.5"
description = "Local Japanese mahjong placement and rank-pt scenario analysis"
readme = "README.en.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "听雀 TingQue"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
rankpt = "rankpt.cli:main"

[project.urls]
Homepage = "https://tingque.ai"

[tool.setuptools]
packages = ["rankpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_rankpt.py", "test_cli.py", "test_release.py"]
norecursedirs = ["node_modules", ".venv", "dist", "dist-standalone"]
